name: Nightly AF Solution matching

# Pays AF Solution binary income (src/lib/package-plan.ts).
# Fires 18:00 UTC = 23:30 IST, before the 00:00 IST points-decay run.
#
# Uses the same repo secrets as points-decay-cron.yml: APP_URL, CRON_SECRET.
# The endpoint is idempotent per IST-date, so a re-run the same day is a no-op.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call af-matching endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            "${APP_URL}/api/cron/af-matching" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
